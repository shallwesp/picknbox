<title>오늘의 특가</title>
<meta name="theme-color" content="#E4E7F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘의 특가">
<link rel="manifest" href='data:application/manifest+json,{"name":"오늘의 특가","short_name":"특가","display":"standalone","background_color":"%23E4E7F8","theme_color":"%23E4E7F8","start_url":"."}'>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root{
    --ground-a:#EEF0FB; --ground-b:#D9DDF5;
    --card:#FFFFFF; --ink:#15161D; --ink-2:#4B4E5E; --mute:#8A8D9C; --line:#E9EAF2;
    --accent:#E0261F; --tag:#FFECEA; --badge:#15161D; --cta-ink:#fff;
    --radius:20px;
    --font:"Noto Sans KR",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    color-scheme:light only;
  }
  html,body{height:100%}
  body{margin:0;font-family:var(--font);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
       background:linear-gradient(160deg,var(--ground-a),var(--ground-b))}
  a{color:inherit}
  .app{position:relative;max-width:430px;margin:0 auto;min-height:100%;box-sizing:border-box;
       padding:16px 16px calc(84px + env(safe-area-inset-bottom,0px))}
  .view{display:flex;flex-direction:column;gap:14px}
  @media (min-width:600px){
    body{padding-block:28px}
    /* PC: 프레임 자체가 스크롤되는 '폰 화면'. 탭바는 프레임 바닥에 sticky */
    .app{height:calc(100vh - 56px);min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;
         border-radius:36px;background:linear-gradient(160deg,#F4F5FD,#E6E9F8);padding-bottom:0;
         box-shadow:0 30px 70px rgba(50,60,120,.22),0 0 0 10px #fff,0 0 0 11px #D5D9F0}
  }
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 4px 2px;min-height:28px}
  .topbar .t{font-weight:900;font-size:16px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
  .topbar .t.brand{color:var(--accent)}
  .topbar .d{font-size:12px;color:var(--mute)}
  .back{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:16px;line-height:1}
  .back:focus-visible,.chip:focus-visible,.mini:focus-visible,.tab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  /* ── 상품 카드 ── */
  .card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 14px 34px rgba(40,60,140,.12)}
  .body{display:grid;grid-template-columns:37% 1fr;gap:12px;padding:16px 16px 14px}
  .visual{position:relative;display:grid;place-items:center;min-height:190px}
  .badge{position:absolute;left:0;top:0;z-index:1;background:var(--badge);color:#fff;font-weight:900;font-size:13px;padding:5px 10px;border-radius:999px;letter-spacing:-.3px}
  .photo{width:auto;max-width:100%;max-height:190px;height:auto;border-radius:12px;margin-top:30px}
  .thumb{position:absolute;right:-4px;bottom:0;width:58px;height:58px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink-2);text-align:center;line-height:1.25;box-shadow:0 6px 14px rgba(0,0,0,.1)}
  .thumb b{font-size:15px;color:var(--ink)}
  .info{display:flex;flex-direction:column;gap:10px;min-width:0}
  h1{margin:0;font-size:19px;font-weight:900;line-height:1.3;letter-spacing:-.4px;word-break:keep-all;overflow-wrap:anywhere}
  h1 em{font-style:normal;color:var(--accent)}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tags span{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--tag);color:var(--accent)}
  .prices{display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums;border-top:1px solid var(--line);padding-top:10px}
  .prices .r,.month{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
  .prices .k{font-size:13px;color:var(--mute);white-space:nowrap}
  .prices .k.b{font-size:14px;font-weight:700;color:var(--ink)}
  .prices .v{color:var(--ink-2);font-weight:600;font-size:13.5px;white-space:nowrap;margin-left:auto}
  .prices .v.s{color:var(--mute);text-decoration:line-through;font-weight:400}
  .prices .v.b{color:var(--ink);font-size:22px;font-weight:900;letter-spacing:-.6px}
  .prices .v.b span,.month .v span{font-size:13px;font-weight:600}
  .month{border-top:1px solid var(--line);padding-top:10px;font-variant-numeric:tabular-nums}
  .month .k{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
  .month .v{font-size:22px;font-weight:900;color:var(--accent);letter-spacing:-.6px;white-space:nowrap;margin-left:auto}
  @media (max-width:360px){.body{grid-template-columns:1fr}.visual{min-height:170px}}

  /* ── 반짝이는 CTA ── */
  .btn{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;justify-content:center;gap:8px;
       background:linear-gradient(100deg,#FF5A3C 0%,#E8191F 45%,#B80F1C 100%);color:var(--cta-ink);text-decoration:none;font-weight:800;font-size:18px;letter-spacing:-.2px;padding:18px;
       text-shadow:0 1px 2px rgba(0,0,0,.25);animation:glow 2.2s ease-in-out infinite;transition:filter .12s}
  .btn::before{content:"";position:absolute;inset:-40% auto -40% -60%;width:38%;transform:skewX(-22deg);z-index:1;
       background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 100%);animation:shine 2.6s ease-in-out infinite}
  .btn::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%);pointer-events:none}
  .btn>*{position:relative;z-index:2}
  .btn:hover{filter:brightness(1.08)} .btn:focus-visible{outline:3px solid #fff;outline-offset:-4px}
  .btn svg{width:13px;height:13px;flex:none}
  @keyframes shine{0%{left:-60%}55%{left:130%}100%{left:130%}}
  @keyframes glow{0%,100%{box-shadow:0 8px 22px rgba(232,25,31,.28)}50%{box-shadow:0 10px 30px rgba(255,80,60,.55)}}

  .spec{background:var(--card);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
  .spec h2{margin:0;font-size:13px;font-weight:700;color:var(--mute);letter-spacing:.4px}
  .spec dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
  .spec dt{color:var(--mute);white-space:nowrap} .spec dd{margin:0;font-weight:500;text-align:right;font-variant-numeric:tabular-nums;word-break:keep-all}
  .spec dd s{color:var(--mute);font-weight:400;font-size:12px;margin-left:4px}
  .legal{font-size:11.5px;line-height:1.6;color:var(--mute);text-align:center;padding:0 8px}
  .legal p{margin:0 0 6px}

  /* ── 목록/홈 ── */
  .hero{position:relative;padding:14px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
  .hero .flame{position:absolute;left:2px;top:-6px;width:46px;height:54px;transform:rotate(-14deg);filter:drop-shadow(0 6px 10px rgba(232,25,31,.35));animation:flick 1.6s ease-in-out infinite}
  @keyframes flick{0%,100%{transform:rotate(-14deg) scale(1)}50%{transform:rotate(-10deg) scale(1.06)}}
  @media (prefers-reduced-motion:reduce){.hero .flame{animation:none}}
  .hero .pill{display:inline-block;font-size:12.5px;font-weight:700;color:#fff;padding:6px 14px;border-radius:999px;
              background:linear-gradient(90deg,#FF6A3D,#E8191F 60%,#C4102A);box-shadow:0 6px 16px rgba(232,25,31,.28)}
  .hero h1{font-size:30px;font-weight:900;letter-spacing:-1px;line-height:1.15;word-break:keep-all}
  .hero h1 em{font-style:normal;font-weight:900;background:linear-gradient(90deg,#FF5A3C,#E8191F 55%,#B80F1C);
              -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;text-decoration:none;font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink-2)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip .n{opacity:.6;font-weight:500;margin-left:4px}
  .list{display:grid;grid-template-columns:1fr;gap:12px}
  .mini{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:12px;text-decoration:none;box-shadow:0 8px 22px rgba(40,60,140,.08);position:relative}
  .mini img{width:96px;height:96px;object-fit:contain;border-radius:12px;background:#F6F7FB}
  .mini .nm{font-weight:700;font-size:14.5px;line-height:1.35;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mini .pr{margin-top:6px;font-size:18px;font-weight:900;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
  .mini .pr small{font-size:12px;font-weight:600}
  .mini .bd{position:absolute;left:12px;top:12px;background:var(--badge);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
  .mini .tg{margin-top:4px;font-size:11.5px;color:var(--accent);font-weight:700}
  .sec-t{margin:6px 4px -4px;font-size:13px;font-weight:700;color:var(--mute);letter-spacing:.4px}
  .empty{background:var(--card);border-radius:18px;padding:28px 18px;text-align:center;color:var(--mute);font-size:14px}

  /* ── 하단 탭바 ── */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;margin:0 auto;max-width:430px;box-sizing:border-box;display:flex;
          padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--mute);font-size:11px;font-weight:700;padding:4px 0;border-radius:10px}
  .tab.on{color:var(--ink)}
  .tab svg{width:22px;height:22px}
  @media (prefers-reduced-motion:reduce){.btn{transition:none;animation:none;box-shadow:0 8px 22px rgba(232,25,31,.3)}.btn::before{animation:none;display:none}}
  /* PC: 탭바를 폰 프레임 바닥에 맞춘다 (기본 .tabbar 규칙보다 뒤에 있어야 적용됨) */
  @media (min-width:600px){
    .tabbar{position:sticky;bottom:0;left:auto;right:auto;max-width:none;margin:14px -16px 0;border-radius:0;padding-bottom:12px}
  }
</style>

  <div class="view" id="view" aria-live="polite"></div>
  <nav class="tabbar" id="tabbar" aria-label="주요 메뉴"></nav>
</div>

      <div class="hero">
        <svg class="flame" viewBox="0 0 48 56" aria-hidden="true"><defs><linearGradient id="fg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#B80F1C"/><stop offset=".55" stop-color="#FF3B30"/><stop offset="1" stop-color="#FFB03B"/></linearGradient><linearGradient id="fg2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF7A3D"/><stop offset="1" stop-color="#FFE29A"/></linearGradient></defs>
          <path fill="url(#fg)" d="M26 2c2 9 12 13 14 25 2 13-7 27-20 27S-2 44 3 29c2-6 6-9 9-13 1 5 3 8 6 9-1-8 2-17 8-23z"/>
          <path fill="url(#fg2)" d="M22 30c1 5 6 7 6 13 0 5-4 9-8 9s-8-4-8-9c0-4 3-6 4-9 1 2 2 3 4 4 0-3 0-6 2-8z"/></svg>
        <span class="pill">${esc(D.site.hook_sub)}</span><h1>${esc(D.site.hook)} <em>${esc(D.site.hook_em||'')}</em></h1></div>
      ${chips(null)}
      <div class="sec-t">최근 등록</div>
      <div class="list">${D.products.map(miniCard).join('')}</div>
      <div class="legal"><p>${disc}</p></div>`;
  }
  function renderCategory(slug){
    const c = cat(slug); const items = slug === 'all' ? D.products : D.products.filter(p => p.category === slug);
    setAccent(c ? c.accent : '#E0261F');
    $app.innerHTML = `<div class="topbar"><span class="t"><a class="back" href="#/" aria-label="홈으로">‹</a>${esc(c ? c.label : '전체')}</span><span class="d">${items.length}개</span></div>
      ${chips(slug === 'all' ? null : slug)}
      ${items.length ? `<div class="list">${items.map(miniCard).join('')}</div>` : `<div class="empty">아직 등록된 제품이 없어요.<br>곧 추가됩니다.</div>`}
      <div class="legal"><p>${disc}</p></div>`;
  }
  function renderProduct(slug){
    const p = D.products.find(x => x.slug === slug);
    if(!p){ renderHome(); return; }
    const c = cat(p.category) || {}; setAccent(c.accent);
    const rows = (p.price_rows||[]).map(r => `<div class="r"><span class="k ${r.strong?'b':''}">${esc(r.label)}</span><span class="v ${r.strike?'s':''} ${r.strong?'b':''}">${esc(r.value)}${r.unit?`<span>${esc(r.unit)}</span>`:''}</span></div>`).join('');
    const others = D.products.filter(x => x.category === p.category && x.slug !== p.slug);
    $app.innerHTML = `<div class="topbar"><span class="t"><a class="back" href="#/c/${esc(p.category)}" aria-label="${esc(c.label||'목록')}으로">‹</a>${esc(c.label||'')}</span><span class="d"></span></div>
      <section class="card" aria-label="${esc(p.name)}">
        <div class="body">
          <div class="visual">${p.badge?`<span class="badge">${esc(p.badge)}</span>`:''}<img class="photo" src="${p.image}" alt="${esc(p.name)}">
            ${p.thumb?`<div class="thumb"><span><b>${esc(p.thumb.big)}</b>${esc(p.thumb.small||'')}<br>${esc(p.thumb.sub||'')}</span></div>`:''}</div>
          <div class="info">
            <h1>${esc(p.name)} ${p.highlight?`<em>${esc(p.highlight)}</em>`:''}</h1>
            <div class="tags">${(p.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div>
            <div class="prices">${rows}</div>
            ${p.accent_row?`<div class="month"><span class="k">${esc(p.accent_row.label)}</span><span class="v">${esc(p.accent_row.value)}${p.accent_row.unit?`<span>${esc(p.accent_row.unit)}</span>`:''}</span></div>`:''}
          </div>
        </div>
        <a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener sponsored">${esc(p.cta||'구매하러 가기')}${arrow}</a>
      </section>
      ${p.specs&&p.specs.length?`<section class="spec"><h2>상품 정보</h2><dl>${p.specs.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></section>`:''}
      ${p.options&&p.options.length?`<section class="spec"><h2>함께 구매 옵션 · 혜택</h2><dl>${p.options.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl></section>`:''}
      ${others.length?`<div class="sec-t">${esc(c.label||'')} 다른 제품</div><div class="list">${others.map(miniCard).join('')}</div>`:''}
      <div class="legal"><p>가격·배송·적립 정보는 쿠팡 상품 페이지 기준이며<br>예고 없이 바뀔 수 있습니다.</p><p>${disc}</p></div>`;
  }
  function renderTabs(route){
    const home = route === 'home', list = route === 'cat';
    $tab.innerHTML = `<a class="tab ${home?'on':''}" href="#/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈</a>
      <a class="tab ${list?'on':''}" href="#/c/all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>카테고리</a>`;
  }
  function route(){
    const h = location.hash.replace(/^#\/?/, '');
    const [kind, slug] = h.split('/');
    if(kind === 'p' && slug){ renderProduct(decodeURIComponent(slug)); renderTabs('prod'); }
    else if(kind === 'c'){ renderCategory(decodeURIComponent(slug||'all')); renderTabs('cat'); }
    else { renderHome(); renderTabs('home'); }
    window.scrollTo(0,0); $frame.scrollTo(0,0);
  }
  window.addEventListener('hashchange', route); route();
})();
</script>
