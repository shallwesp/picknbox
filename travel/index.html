<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  /* 전자기기 특가(빨강·라벤더)와 구분되는 숙소관 전용 톤: 바다빛 청록 + 모래색 */
  :root{
    --ground-a:#EEF6F4; --ground-b:#DCEBEA;
    --card:#FFFFFF; --ink:#13201F; --ink-2:#44524F; --mute:#83908D; --line:#E3ECEA;
    --brand:#0E7C7B; --brand-soft:#E2F2F0; --sand:#FFF6E8; --sand-ink:#8A5A12;
    --radius:20px;
    --font:"Noto Sans KR",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    color-scheme:light only;
  }
  html,body{height:100%}
  html{padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;font-family:var(--font);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
       background:linear-gradient(160deg,var(--ground-a),var(--ground-b))}
  img{max-width:100%}
  [hidden]{display:none!important}
  a{color:inherit}
  .app{position:relative;max-width:430px;margin:0 auto;min-height:100%;box-sizing:border-box;padding:16px 16px 110px}
  .view{display:flex;flex-direction:column;gap:14px}
  @media (min-width:600px){
    body{padding-block:28px}
    .app{height:calc(100vh - 56px);min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;border-radius:36px;
         background:linear-gradient(160deg,#F4FAF9,#E4F0EF);padding-bottom:0;
         box-shadow:0 30px 70px rgba(20,80,80,.2),0 0 0 10px #fff,0 0 0 11px #CFE3E1}
  }
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 4px 2px;min-height:30px}
  .topbar .t{font-weight:900;font-size:16px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px;color:var(--brand)}
  .topbar .d{font-size:12px;color:var(--mute)}
  .back{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:16px;line-height:1}
  a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

  /* 홈 */
  .hero{padding:10px 4px 2px;display:flex;flex-direction:column;gap:6px}
  .hero .pill{align-self:flex-start;font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:5px 12px;border-radius:999px}
  .hero h1{margin:0;font-size:28px;font-weight:900;letter-spacing:-1px;line-height:1.2;word-break:keep-all}
  .hero p{margin:0;color:var(--ink-2);font-size:14px}
  .list{display:grid;gap:14px}
  .stay{display:block;background:var(--card);border-radius:var(--radius);overflow:hidden;text-decoration:none;box-shadow:0 12px 30px rgba(20,80,80,.1)}

  .stay .b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px}
  .stay .rg{font-size:12px;font-weight:700;color:var(--brand)}
  .stay .nm{font-size:17px;font-weight:900;letter-spacing:-.4px;line-height:1.35;word-break:keep-all}
  .stay .ft{font-size:13.5px;color:var(--ink-2);word-break:keep-all}
  .stay .pr{margin-top:4px;font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}

  .btn{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;
       background:linear-gradient(100deg,#FF5A5C 0%,#E8273A 50%,#C40A26 100%);color:#fff;text-decoration:none;font-weight:800;font-size:17px;padding:17px;
       text-shadow:0 1px 2px rgba(0,0,0,.2);box-shadow:0 10px 24px rgba(200,20,40,.3)}
  .btn::before{content:"";position:absolute;inset:-40% auto -40% -60%;width:38%;transform:skewX(-22deg);z-index:1;
       background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.5),rgba(255,255,255,0));animation:shine 2.8s ease-in-out infinite}
  .btn>*{position:relative;z-index:2}
  /* 하단 고정 버튼은 숙소관 청록 계열로 (위 빨간 버튼과 구분) */
  .btn.alt{background:linear-gradient(100deg,#1FB5A8 0%,#0E8C89 50%,#0A6466 100%);box-shadow:0 10px 24px rgba(10,100,100,.3)}
  .btn svg{width:13px;height:13px}
  @keyframes shine{0%{left:-60%}55%{left:130%}100%{left:130%}}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:10;max-width:430px;margin:0 auto;box-sizing:border-box;
        padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  @media (min-width:600px){.dock{position:sticky;margin:14px -16px 0;max-width:none}}
  @media (prefers-reduced-motion:reduce){.btn::before{animation:none;display:none}}
  .legal{font-size:11.5px;line-height:1.6;color:var(--mute);text-align:center;padding:0 8px}
  .legal p{margin:0 0 8px;word-break:keep-all}
