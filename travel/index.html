<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 숙소</title>
<meta name="description" content="직접 정리한 국내 숙소 정보와 예약 전 체크리스트">
<meta property="og:title" content="오늘의 숙소"><meta property="og:description" content="예약 전에 꼭 알아야 할 것만 정리했어요">
<meta name="theme-color" content="#E3F0EF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%A1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  /* 전자기기 특가(빨강·라벤더)와 구분되는 숙소관 전용 톤: 바다빛 청록 + 모래색 */
  :root{
    --ground-a:#EEF6F4; --ground-b:#DCEBEA;
    --card:#FFFFFF; --ink:#13201F; --ink-2:#44524F; --mute:#83908D; --line:#E3ECEA;
    --brand:#0E7C7B; --brand-soft:#E2F2F0; --sand:#FFF6E8; --sand-ink:#8A5A12;
    --radius:20px;
    --font:"Noto Sans KR",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    color-scheme:light only;
  }
  html,body{height:100%}
  html{padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;font-family:var(--font);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
       background:linear-gradient(160deg,var(--ground-a),var(--ground-b))}
  img{max-width:100%}
  [hidden]{display:none!important}
  a{color:inherit}
  .app{position:relative;max-width:430px;margin:0 auto;min-height:100%;box-sizing:border-box;padding:16px 16px 110px}
  .view{display:flex;flex-direction:column;gap:14px}
  @media (min-width:600px){
    body{padding-block:28px}
    .app{height:calc(100vh - 56px);min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;border-radius:36px;
         background:linear-gradient(160deg,#F4FAF9,#E4F0EF);padding-bottom:0;
         box-shadow:0 30px 70px rgba(20,80,80,.2),0 0 0 10px #fff,0 0 0 11px #CFE3E1}
  }
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 4px 2px;min-height:30px}
  .topbar .t{font-weight:900;font-size:16px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px;color:var(--brand)}
  .topbar .d{font-size:12px;color:var(--mute)}
  .back{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:16px;line-height:1}
  a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

  /* 홈 */
  .hero{padding:10px 4px 2px;display:flex;flex-direction:column;gap:6px}
  .hero .pill{align-self:flex-start;font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:5px 12px;border-radius:999px}
  .hero h1{margin:0;font-size:28px;font-weight:900;letter-spacing:-1px;line-height:1.2;word-break:keep-all}
  .hero p{margin:0;color:var(--ink-2);font-size:14px}
  .list{display:grid;gap:14px}
  .stay{display:block;background:var(--card);border-radius:var(--radius);overflow:hidden;text-decoration:none;box-shadow:0 12px 30px rgba(20,80,80,.1)}
  .stay img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#E8EFEE}
  .stay .b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px}
  .stay .rg{font-size:12px;font-weight:700;color:var(--brand)}
  .stay .nm{font-size:17px;font-weight:900;letter-spacing:-.4px;line-height:1.35;word-break:keep-all}
  .stay .ft{font-size:13.5px;color:var(--ink-2);word-break:keep-all}
  .stay .pr{margin-top:4px;font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}

  /* 상세 */
  .gallery{position:relative;border-radius:var(--radius);overflow:hidden;background:#E8EFEE;box-shadow:0 14px 34px rgba(20,80,80,.14)}
  .slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .slides::-webkit-scrollbar{display:none}
  .slides img{flex:none;width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:start;display:block}
  .count{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
  .hookq{position:absolute;left:12px;top:12px;max-width:80%;background:rgba(255,255,255,.94);color:var(--ink);font-size:13px;font-weight:800;padding:6px 12px;border-radius:999px;box-shadow:0 6px 16px rgba(0,0,0,.12)}
  .card{background:var(--card);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 26px rgba(20,80,80,.07)}
  .rg2{font-size:12.5px;font-weight:700;color:var(--brand)}
  h1.nm{margin:0;font-size:22px;font-weight:900;letter-spacing:-.6px;line-height:1.3;word-break:keep-all}
  .feat{margin:0;color:var(--ink-2);font-size:14.5px;word-break:keep-all}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tags span{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
  .price{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:12px}
  .price .k{font-size:13px;color:var(--mute)}
  .price .v{font-size:24px;font-weight:900;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
  .pnote{font-size:12px;color:var(--mute);margin-top:-4px}
  .sum{display:grid;gap:8px;background:var(--sand);border-radius:14px;padding:12px 14px;font-size:13.5px}
  .sum div{display:grid;grid-template-columns:auto 1fr;gap:10px}
  .sum b{color:var(--sand-ink);white-space:nowrap}
  h2{margin:0;font-size:16px;font-weight:900;letter-spacing:-.3px}
  .pt{display:flex;flex-direction:column;gap:4px;padding-top:4px}
  .pt + .pt{border-top:1px solid var(--line);padding-top:12px}
  .pt h3{margin:0;font-size:15px;font-weight:800}
  .pt p{margin:0;color:var(--ink-2);font-size:14px;word-break:keep-all}
  ul.chk{margin:0;padding:0;list-style:none;display:grid;gap:8px}
  ul.chk li{position:relative;padding-left:24px;font-size:14px;color:var(--ink-2);word-break:keep-all}
  ul.chk li::before{content:"";position:absolute;left:2px;top:5px;width:14px;height:14px;border-radius:4px;background:var(--brand-soft);box-shadow:inset 0 0 0 1.5px var(--brand)}
  details{border-top:1px solid var(--line);padding:10px 0 0}
  details:first-of-type{border-top:0;padding-top:0}
  summary{cursor:pointer;font-weight:700;font-size:14.5px;list-style:none;display:flex;gap:8px}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"Q";color:var(--brand);font-weight:900}
  details p{margin:6px 0 2px 20px;color:var(--ink-2);font-size:14px;word-break:keep-all}

  /* 빨간 그라데이션 CTA (블로그 버튼과 같은 색) */
  .btn{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;
       background:linear-gradient(100deg,#FF5A5C 0%,#E8273A 50%,#C40A26 100%);color:#fff;text-decoration:none;font-weight:800;font-size:17px;padding:17px;
       text-shadow:0 1px 2px rgba(0,0,0,.2);box-shadow:0 10px 24px rgba(200,20,40,.3)}
  .btn::before{content:"";position:absolute;inset:-40% auto -40% -60%;width:38%;transform:skewX(-22deg);z-index:1;
       background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.5),rgba(255,255,255,0));animation:shine 2.8s ease-in-out infinite}
  .btn>*{position:relative;z-index:2}
  /* 하단 고정 버튼은 숙소관 청록 계열로 (위 빨간 버튼과 구분) */
  .btn.alt{background:linear-gradient(100deg,#1FB5A8 0%,#0E8C89 50%,#0A6466 100%);box-shadow:0 10px 24px rgba(10,100,100,.3)}
  .btn svg{width:13px;height:13px}
  @keyframes shine{0%{left:-60%}55%{left:130%}100%{left:130%}}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:10;max-width:430px;margin:0 auto;box-sizing:border-box;
        padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  @media (min-width:600px){.dock{position:sticky;margin:14px -16px 0;max-width:none}}
  @media (prefers-reduced-motion:reduce){.btn::before{animation:none;display:none}}
  .legal{font-size:11.5px;line-height:1.6;color:var(--mute);text-align:center;padding:0 8px}
  .legal p{margin:0 0 8px;word-break:keep-all}
</style></head><body>

<script>
(function(){
  const D = JSON.parse(document.getElementById('d').textContent);
  const $v = document.getElementById('view'), $dock = document.getElementById('dock'), $app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const arrow = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 2l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const legal = `<div class="legal"><p>가격과 객실 정보는 쿠팡트래블 상품 페이지 기준이며<br>예고 없이 바뀔 수 있어요.</p><p>${esc(D.site.disclosure).replace('일환으로, ', '일환으로,<br>')}</p></div>`;
  const cta = (p, label, alt) => `<a class="btn${alt?' alt':''}" href="${esc(p.link)}" target="_blank" rel="noopener sponsored"><span>${esc(label)}</span>${arrow}</a>`;

  function home(){
    document.title = D.site.name;
    $dock.innerHTML = '';
    $v.innerHTML = `<div class="topbar"><span class="t">🏡 ${esc(D.site.name)}</span><span class="d">${D.items.length}곳</span></div>
      <div class="hero"><span class="pill">예약 전 체크리스트까지</span><h1>가볼 만한 숙소,<br>직접 정리했어요</h1>
        <p>시설·규정·자주 묻는 질문을 한 번에 보고 쿠팡트래블에서 날짜별 요금을 확인하세요.</p></div>
      <div class="list">${D.items.map(p => `<a class="stay" href="#/p/${p.id}">
        <img src="${esc(p.photos[0] && p.photos[0].url)}" alt="${esc(p.name)}" loading="lazy" referrerpolicy="no-referrer">
        <div class="b"><span class="rg">${esc(p.region)}</span><span class="nm">${esc(p.name)}</span>
          <span class="ft">${esc(p.feature)}</span><span class="pr">${esc(p.price)}</span></div></a>`).join('')}</div>${legal}`;
  }

  function detail(id){
    const p = D.items.find(x => String(x.id) === String(id));
    if(!p){ home(); return; }
    document.title = p.name + ' | ' + D.site.name;
    $v.innerHTML = `<div class="topbar"><span class="t"><a class="back" href="#/" aria-label="숙소 목록으로">‹</a>${esc(p.region)}</span><span class="d">${esc(D.site.name)}</span></div>
      <div class="gallery"><div class="slides" id="slides">${p.photos.map((ph,i) => `<img src="${esc(ph.url)}" alt="${esc(p.name)} ${esc(ph.desc)}" ${i?'loading="lazy"':''} referrerpolicy="no-referrer">`).join('')}</div>
        ${p.hook?`<span class="hookq">“${esc(p.hook)}”</span>`:''}<span class="count" id="count">1 / ${p.photos.length}</span></div>
      <section class="card"><span class="rg2">📍 ${esc(p.addr)}</span><h1 class="nm">${esc(p.name)}</h1>
        ${p.feature?`<p class="feat">${esc(p.feature)}</p>`:''}
        <div class="tags">${p.tags.map(t => `<span>#${esc(t)}</span>`).join('')}</div>
        <div class="price"><span class="v">${esc(p.price)}</span></div>
        <div class="sum"><div><b>추천</b><span>${esc(p.recommend_one)}</span></div><div><b>꼭 알 것</b><span>${esc(p.must_know)}</span></div></div>
        ${cta(p, '날짜별 요금 보기')}</section>
      ${legal}`;
    $dock.innerHTML = `<div class="dock">${cta(p, '남은 객실·최신 가격 보러가기', true)}</div>`;
    const sl = document.getElementById('slides'), ct = document.getElementById('count');
    sl.addEventListener('scroll', () => { ct.textContent = (Math.round(sl.scrollLeft / sl.clientWidth) + 1) + ' / ' + p.photos.length; }, {passive:true});
  }

  function route(){
    const [kind, id] = location.hash.replace(/^#\/?/, '').split('/');
    if(kind === 'p' && id) detail(decodeURIComponent(id)); else home();
    window.scrollTo(0,0); $app.scrollTo(0,0);
  }
  window.addEventListener('hashchange', route); route();
})();
</script></body></html>
